<svg xmlns="http://www.w3.org/2000/svg" viewBox="280 110 240 240" role="img" aria-labelledby="entomiraIconTitle">
  <title id="entomiraIconTitle">ENTOMIRA — icono</title>

  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00423C"/>
      <stop offset="100%" stop-color="#006F66"/>
    </linearGradient>
    <radialGradient id="lensGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#D9FFA6"/>
      <stop offset="55%" stop-color="#B4FF48"/>
      <stop offset="100%" stop-color="#8CC21E"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D1E1C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g stroke="#006F66" stroke-width="3" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M300,180 V150 H330"/>
    <path d="M500,180 V150 H470"/>
    <path d="M300,310 V340 H330"/>
    <path d="M500,310 V340 H470"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M0,0 Q34,-50 0,-100 Q-34,-50 0,0 Z" fill="url(#leafGrad)" transform="translate(400,300) rotate(-35)"/>
    <path d="M0,0 Q34,-50 0,-100 Q-34,-50 0,0 Z" fill="url(#leafGrad)" transform="translate(400,300) rotate(35)"/>

    <path d="M400,300 Q385,220 368,178" fill="none" stroke="#00544D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="368" cy="178" r="3.5" fill="#00544D"/>
    <path d="M400,300 Q415,220 432,178" fill="none" stroke="#00544D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="432" cy="178" r="3.5" fill="#00544D"/>

    <circle cx="400" cy="300" r="30" fill="url(#lensGrad)" opacity="0.14"/>
    <circle cx="400" cy="300" r="22" fill="none" stroke="#8CC21E" stroke-width="1.5" opacity="0.5"/>
    <circle cx="400" cy="300" r="17" fill="url(#lensGrad)"/>
  </g>
</svg>
